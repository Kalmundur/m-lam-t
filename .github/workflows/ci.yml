name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate content, test and build
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and Playwright's
    # --with-deps install needs an OS release it knows about.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails the job if any question is invalid.
      - name: Validate questions
        run: npm run validate

      # Never fails: unbalanced party coverage shows up as warning annotations.
      - name: Party balance report
        run: npm run balance

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `npx next build` rather than `npm run build`: validation already ran above,
      # so the prebuild hook would only repeat it.
      - name: Build static site
        run: npx next build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Plays the daily quiz and a practice round against the static build in out/.
      - name: End-to-end tests
        run: npm run test:e2e
